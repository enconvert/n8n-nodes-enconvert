name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned rather than 'lts/*' on purpose. The npm major that ships with
          # Node decides how strictly `npm ci` validates optional dependencies in
          # the lockfile, so letting it drift can break CI without any change to
          # this repo. Bump this deliberately, and regenerate package-lock.json
          # on the same major when you do.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # --omit=optional on purpose. playwright (a transitive dev dependency of
        # @n8n/node-cli) optionally depends on fsevents, which is macOS-only and
        # needs a native build. Generating the lockfile on macOS drops fsevents
        # when that build fails, and Linux npm then fails validation looking for
        # it. Omitting optional dependencies sidesteps the whole class: this
        # package ships zero runtime dependencies, and neither lint nor build
        # touches playwright or fsevents.
        run: 'npm ci --omit=optional'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'
