name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned rather than 'lts/*' so the Node and npm majors cannot drift
          # underneath the build. Bump deliberately.
          node-version: '24'
          # No `cache: 'npm'` here. It derives its cache key from a lockfile and
          # fails the job outright when there is none, and this repo does not
          # commit one.

      - name: Install dependencies
        # `npm install`, not `npm ci`: this repo does not commit a lockfile.
        # See the note in .gitignore. Every devDependency that affects the build
        # output is pinned to an exact version in package.json, so the install is
        # reproducible without one.
        run: 'npm install --no-audit --no-fund'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'
